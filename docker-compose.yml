version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - STORAGE_DIR=/app/storage
    volumes:
      - ./storage:/app/storage
      - ./datasets:/app/datasets
      - ./documents:/app/documents
    restart: unless-stopped

  sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
    container_name: proofai-sandbox
    network_mode: none
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
